services:
  mailpit:
    image: axllent/mailpit:v1.31.4
    container_name: dentalapp-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 1000
      TZ: Europe/Istanbul
    volumes:
      - ./storage/mailpit:/data
