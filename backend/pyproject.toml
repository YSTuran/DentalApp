[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dentalapp-backend"
version = "0.1.0"
description = "DentalApp FastAPI backend"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16,<2",
    "celery[redis]>=5.5,<6",
    "firebase-admin>=6.6,<8",
    "fastapi>=0.116,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "redis>=6,<8",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires explicitly enabled local integration services",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
